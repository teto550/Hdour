<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="خدمة ابتدائي البابا اثناسيوس">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-193.png">
<title>خدمة ابتدائي البابا اثناسيوس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- ملفات الستايل (الترتيب مهم — نفس ترتيب الكود الأصلي) -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/attendance.css">
<link rel="stylesheet" href="css/lists.css">
<link rel="stylesheet" href="css/filters.css">
<link rel="stylesheet" href="css/modals.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/servants.css">
<link rel="stylesheet" href="css/screens-misc.css">
<link rel="stylesheet" href="css/monitor.css">
<link rel="stylesheet" href="css/admin-home.css">
<link rel="stylesheet" href="css/effects.css">
</head>
<body>

<!-- SPLASH / LOADING -->
<div id="splash-screen">
  <img src="icon-193.png">
</div>

<!-- شاشات التطبيق: كل واحدة في ملف مستقل جوه فولدر views/ — boot.js بيحمّلها ويحطها مكان كل سطر data-include -->

<div data-include="views/auth.html"></div>
<div data-include="views/pending.html"></div>

<!-- APP -->
<div id="app-screen">
<div data-include="views/app/top-bar.html"></div>
  <div class="app-content">
<div data-include="views/app/navigation.html"></div>
<div data-include="views/tabs/attendance.html"></div>
<div data-include="views/tabs/students.html"></div>
<div data-include="views/tabs/filters.html"></div>
<div data-include="views/tabs/messages.html"></div>
<div data-include="views/tabs/monitor.html"></div>
<div data-include="views/tabs/class-servants.html"></div>
<div data-include="views/tabs/roles.html"></div>
  </div>
</div>

<!-- النوافذ المنبثقة (Modals) -->
<div data-include="views/modals/role-add-members.html"></div>
<div data-include="views/modals/profile.html"></div>
<div data-include="views/modals/edit-student.html"></div>
<div data-include="views/modals/bio-offer.html"></div>
<div data-include="views/modals/settings.html"></div>
<div data-include="views/modals/export.html"></div>
<div data-include="views/modals/export-class-pick.html"></div>
<div data-include="views/modals/dash-settings.html"></div>
<div data-include="views/modals/dash-view.html"></div>
<div data-include="views/modals/servant-profile.html"></div>

<div id="install-banner">
  <div class="install-inner">
    <img src="icon-193.png" style="width:44px;height:44px;border-radius:11px;flex-shrink:0">
    <div style="flex:1"><div style="font-size:14px;font-weight:700">نزّل التطبيق</div><div style="font-size:12px;color:var(--text-dim)">أضفه على الشاشة الرئيسية</div></div>
    <button id="install-btn" style="background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:9px;color:#fff;font-family:Cairo,sans-serif;font-size:13px;font-weight:700;padding:9px 14px;cursor:pointer">تثبيت</button>
    <button onclick="document.getElementById('install-banner').style.display='none'" style="background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text-dim);font-size:16px;width:30px;height:30px;cursor:pointer">✕</button>
  </div>
</div>

<div id="toast"></div>

<script type="module" src="js/boot.js"></script>
<script src="js/ui-effects.js"></script>
<script src="js/install-banner.js"></script>
</body>
</html>
