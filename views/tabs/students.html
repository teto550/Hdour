    <!-- STUDENTS TAB -->
    <div id="tab-students" style="display:none">
      <button id="add-student-toggle-btn" class="btn-primary" onclick="toggleAddStudentForm()" style="margin-bottom:14px">➕ إضافة مخدوم</button>
      <div class="add-form" id="add-student-fields" style="display:none">
        <p class="section-title" style="margin-bottom:14px">إضافة مخدوم جديد</p>
        <label class="field-label">الاسم *</label>
        <input type="text" id="new-name" class="field-input" placeholder="اسم المخدوم بالكامل" oninput="onNewNameInput()">
        <div class="form-2col" style="margin-bottom:14px">
          <div>
            <label class="field-label">تاريخ الميلاد</label>
            <input type="date" id="new-dob" class="field-input" style="margin-bottom:0">
          </div>
          <div>
            <label class="field-label">العنوان</label>
            <input type="text" id="new-address" class="field-input" style="margin-bottom:0" placeholder="العنوان">
          </div>
        </div>
        <label class="field-label">النوع</label>
        <select class="field-select" id="new-gender" style="margin-bottom:14px" onchange="newGenderManuallySet=true">
          <option value="">— غير محدد —</option>
          <option value="male">ولد</option>
          <option value="female">بنت</option>
        </select>
        <label class="field-label">أرقام التليفون</label>
        <div class="phones-wrap" id="phones-wrap">
          <div class="phone-row">
            <input type="tel" class="field-input phone-input" placeholder="رقم التليفون" dir="ltr">
            <button class="add-phone-btn" onclick="addPhoneField()">+</button>
          </div>
        </div>
        <button class="btn-primary" onclick="addStudent()">➕ إضافة</button>
      </div>
      <div class="list-header">
        <span class="section-title">المخدومين (<span id="stu-count">0</span>)</span>
      </div>
      <div class="search-box" style="margin-bottom:12px">
        <input type="text" id="students-search-input" placeholder="🔍 ابحث عن مخدوم بالاسم…" oninput="renderStudentsList()" autocomplete="off">
      </div>
      <div class="filter-row" id="siblings-chips" style="margin-bottom:12px">
        <button class="filter-chip active" onclick="setSiblingsFilter('all',this)">الكل</button>
        <button class="filter-chip" onclick="setSiblingsFilter('siblings',this)">👨‍👩‍👧‍👦 الإخوات بس</button>
        <button class="filter-chip" onclick="setSiblingsFilter('nonSiblings',this)">بدون إخوات</button>
      </div>
      <div class="filter-row" id="class-chips" style="margin-bottom:12px"></div>
      <div id="students-list"><div class="loading"><div class="spinner"></div>جاري التحميل…</div></div>
    </div>
