    <!-- ATTENDANCE TAB -->
    <div id="tab-attendance">
      <div class="stats-row">
        <div class="stat-card t"><div class="stat-num" id="stat-total">0</div><div class="stat-label">إجمالي</div></div>
        <div class="stat-card p"><div class="stat-num" id="stat-present">0</div><div class="stat-label">حاضر</div></div>
        <div class="stat-card a"><div class="stat-num" id="stat-absent">0</div><div class="stat-label">غائب</div></div>
      </div>
      <button id="voice-toggle-btn" class="btn-voice" onclick="startVoice()">🎤 تسجيل بالصوت</button>
      <div class="voice-zone" id="voice-zone" style="display:none">
        <div class="mic-pulse-wrap"><span class="mic-pulse-icon">🎤</span></div>
        <div id="voice-mode-badge" style="display:inline-block;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:8px;cursor:pointer;background:rgba(46,204,113,0.12);border:1px solid rgba(46,204,113,0.3);color:var(--success)" onclick="toggleVoiceMode()">✓ وضع: تسجيل حضور</div>
        <div class="voice-heard" id="voice-heard">بيسمعك دلوقتي…</div>
        <div class="voice-hint" id="voice-hint">قول اسم المخدوم (اسمين بيكفوا) — أو قول "تسجيل آية" عشان تبدأ تسجّل سماع، و"تسجيل حضور" عشان ترجع تاني</div>
        <div id="voice-candidates"></div>
      </div>
      <button class="stop-btn" id="voice-stop-btn" onclick="stopVoice()" style="display:none">⏹ إيقاف التسجيل بالصوت</button>
      <div class="manual-wrap" style="margin-top:14px">
        <div class="search-box">
          <input type="text" id="manual-input" placeholder="🔍 أو اكتب اسم المخدوم…" oninput="onManualSearch()" autocomplete="off">
        </div>
        <div id="manual-results"></div>
      </div>
      <div class="list-header">
        <span class="section-title">قائمة اليوم</span>
      </div>
      <div class="filter-row" style="margin-bottom:8px">
        <button class="filter-chip active" id="today-filter-all" onclick="setTodayListFilter('all',this)">الكل</button>
        <button class="filter-chip" id="today-filter-attendance" onclick="setTodayListFilter('attendance',this)">✅ حضور بس</button>
        <button class="filter-chip" id="today-filter-verse" onclick="setTodayListFilter('verse',this)">📖 سماع بس</button>
      </div>
      <div class="list-header" style="margin-top:-4px">
        <button class="export-btn" id="today-sort-btn" onclick="toggleTodayListSort()">⇅ الأول ↞ الأخير</button>
      </div>
      <div id="today-list"><div class="loading"><div class="spinner"></div>جاري التحميل…</div></div>
    </div>
