<!-- EDIT MODAL -->
<div id="edit-modal" class="modal-overlay" style="display:none" onclick="closeEditOutside(event)">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-avatar" id="edit-avatar"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:16px;font-weight:900">تعديل بيانات المخدوم</div>
        <div id="edit-sub" style="font-size:12px;color:var(--text-dim);margin-top:2px"></div>
      </div>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <div style="padding:18px">
      <input type="hidden" id="edit-id">
      <label class="field-label">الاسم *</label>
      <input type="text" id="edit-name" class="field-input" placeholder="اسم المخدوم بالكامل" oninput="onEditNameInput()">
      <div class="form-2col" style="margin-bottom:14px">
        <div>
          <label class="field-label">تاريخ الميلاد</label>
          <input type="date" id="edit-dob" class="field-input" style="margin-bottom:0">
        </div>
        <div>
          <label class="field-label">العنوان</label>
          <input type="text" id="edit-address" class="field-input" style="margin-bottom:0" placeholder="العنوان">
        </div>
      </div>
      <label class="field-label">النوع</label>
      <select class="field-select" id="edit-gender" style="margin-bottom:14px" onchange="editGenderManuallySet=true">
        <option value="">— غير محدد —</option>
        <option value="male">ولد</option>
        <option value="female">بنت</option>
      </select>
      <label class="field-label">الفصل</label>
      <select class="field-select" id="edit-class"></select>
      <label class="field-label">أرقام التليفون</label>
      <div class="edit-phones-wrap" id="edit-phones-wrap"></div>
      <label class="field-label">ملحوظات الافتقاد</label>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px">
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer">
          <input type="checkbox" id="edit-note-traveling" style="width:18px;height:18px;accent-color:var(--accent)"> 🧳 مسافر
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer">
          <input type="checkbox" id="edit-note-friday" style="width:18px;height:18px;accent-color:var(--accent)"> 📅 بيحضر يوم الجمعة
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer">
          <input type="checkbox" id="edit-note-otherchurch" style="width:18px;height:18px;accent-color:var(--accent)"> ⛪ بيحضر في كنيسة تانية
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer">
          <input type="checkbox" id="edit-note-motherpregnant" style="width:18px;height:18px;accent-color:var(--accent)"> 🤰 الأم حامل
        </label>
      </div>
      <div style="display:flex;gap:10px;margin-top:6px">
        <button class="btn-primary" onclick="saveEditStudent()" style="flex:1">💾 حفظ التعديلات</button>
        <button onclick="closeEditModal()" style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-dim);font-family:Cairo,sans-serif;font-size:15px;font-weight:700;padding:13px 18px;cursor:pointer">إلغاء</button>
      </div>
    </div>
  </div>
</div>
