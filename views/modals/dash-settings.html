<!-- DASHBOARD الخدام: SETTINGS MODAL -->
<div id="dash-modal" class="modal-overlay" style="display:none;z-index:340" onclick="closeDashModalOutside(event)">
  <div class="modal-box">
    <div class="modal-header">
      <div style="flex:1;min-width:0">
        <div style="font-size:18px;font-weight:900">📊 داشبورد الخدام</div>
        <div style="font-size:12px;color:var(--text-dim);margin-top:2px">اختار الأقسام اللي عايزها تظهر في الداشبورد</div>
      </div>
      <button class="modal-close" onclick="closeDashModal()">✕</button>
    </div>
    <div style="padding:16px">
      <div id="dash-options" style="max-height:46vh;overflow-y:auto;margin-bottom:18px"></div>
      <div style="display:flex;gap:10px">
        <button onclick="closeDashModal()" style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-dim);font-family:Cairo,sans-serif;font-size:14px;font-weight:700;padding:12px;cursor:pointer">إلغاء</button>
        <button class="btn-primary" onclick="openDashboard()" style="flex:2">📊 اعرض الداشبورد</button>
      </div>
    </div>
  </div>
</div>
