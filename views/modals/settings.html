<!-- SETTINGS MODAL -->
<div id="settings-modal" class="modal-overlay" style="display:none" onclick="closeSettingsOutside(event)">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-avatar" id="settings-avatar"></div>
      <div style="flex:1;min-width:0">
        <div id="settings-name" style="font-size:18px;font-weight:900"></div>
        <div id="settings-email" style="font-size:12px;color:var(--text-dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis" dir="ltr"></div>
      </div>
      <button class="modal-close" onclick="closeSettingsModal()">✕</button>
    </div>
    <div style="padding:16px">
      <div id="settings-profile-section">
        <div class="section-title" style="margin-bottom:8px">ملفي</div>
        <div id="settings-class-badge" style="margin-bottom:12px"></div>
        <label class="field-label">الاسم</label>
        <input type="text" id="settings-name-input" class="field-input" maxlength="60" autocomplete="off">
        <label class="field-label">رقم التليفون</label>
        <input type="tel" id="settings-phone" class="field-input" dir="ltr">
        <label class="field-label">العنوان</label>
        <input type="text" id="settings-address" class="field-input">
        <button class="export-btn" onclick="saveOwnSettings()" style="width:100%">💾 حفظ بياناتي</button>
      </div>

      <div id="settings-bio-section" style="display:none;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)">
        <div class="section-title" style="margin-bottom:6px">الدخول بالبصمة</div>
        <p id="settings-bio-status" style="font-size:12px;color:var(--text-dim);margin:0 0 10px;line-height:1.7"></p>
        <div id="settings-bio-pass-wrap" style="display:none">
          <label class="field-label">اكتب كلمة المرور بتاعتك للتأكيد</label>
          <input type="password" id="settings-bio-pass" class="field-input" dir="ltr" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="export-btn" id="settings-bio-btn" onclick="toggleBioFromSettings()" style="width:100%"></button>
      </div>

      <div id="settings-admin-section" style="display:none">
        <div class="section-title" style="margin-bottom:8px">الخدام</div>
        <p style="font-size:11px;color:var(--text-dim);margin:-4px 0 10px">دوّر باسم الخادم، وبعدين دوس على الفصول اللي عايزه يشوفها (تقدر تختار أكتر من فصل) أو خليه يشوف كل الفصول، وكمان تقدر تخليه أدمن أو تشيله من الأدمن من هنا على طول</p>
        <input type="text" id="settings-people-search" class="field-input" placeholder="🔍 ابحث عن خادم بالاسم…" oninput="renderSettingsPeopleList()" autocomplete="off">
        <div id="settings-people-list" style="max-height:420px;overflow-y:auto;margin-top:10px"></div>
      </div>
    </div>
  </div>
</div>
