<!-- EXPORT CLASS PICK MODAL (اختيار الفصول للتصدير — نفس فكرة إضافة أشخاص) -->
<div id="export-class-pick-modal" class="modal-overlay" style="display:none" onclick="closeExportClassPickOutside(event)">
  <div class="modal-box" style="max-width:380px">
    <div class="modal-header">
      <div style="flex:1;min-width:0">
        <div style="font-size:16px;font-weight:900">إضافة فصل</div>
        <div style="font-size:12px;color:var(--text-dim);margin-top:2px">اختار الفصول اللي عايزها أو اختار كله</div>
      </div>
      <button class="modal-close" onclick="closeExportClassPick()">✕</button>
    </div>
    <div style="padding:16px">
      <button type="button" class="export-btn" id="ecp-all-btn" onclick="toggleExportClassPickAll()" style="width:100%;margin-bottom:10px"></button>
      <div id="ecp-list" style="max-height:55vh;overflow-y:auto"></div>
      <button class="btn-primary" onclick="closeExportClassPick()" style="width:100%;margin-top:14px">تم (<span id="ecp-count">0</span> متحدد)</button>
    </div>
  </div>
</div>
