<!-- DASHBOARD الخدام: FULL VIEW -->
<div id="dash-view" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:320;overflow-y:auto">
  <div style="position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:10px;z-index:5">
    <div style="flex:1;min-width:0">
      <div style="font-size:17px;font-weight:900">📊 داشبورد الخدام</div>
      <div id="dash-subtitle" style="font-size:12px;color:var(--text-dim);margin-top:2px"></div>
    </div>
    <button onclick="openDashModal()" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:Cairo,sans-serif;font-size:13px;font-weight:700;padding:8px 10px;cursor:pointer;flex-shrink:0">⚙️</button>
    <button onclick="printDashboard()" style="background:rgba(46,204,113,0.12);border:1px solid rgba(46,204,113,0.3);border-radius:8px;color:var(--success);font-family:Cairo,sans-serif;font-size:13px;font-weight:700;padding:8px 10px;cursor:pointer;flex-shrink:0">🖨 PDF</button>
    <button onclick="closeDashboard()" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text-dim);font-size:18px;width:36px;height:36px;cursor:pointer;flex-shrink:0">✕</button>
  </div>
  <div id="dash-body" style="padding:16px;max-width:560px;margin:0 auto"></div>
</div>
