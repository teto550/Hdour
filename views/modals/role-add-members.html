<!-- ROLE ADD MEMBERS MODAL (popup بحث واختيار خدام لإضافتهم للدور) -->
<div id="role-add-members-modal" class="modal-overlay" style="display:none" onclick="closeRoleAddMembersOutside(event)">
  <div class="modal-box">
    <div class="modal-header">
      <div style="flex:1;min-width:0">
        <div style="font-size:16px;font-weight:900">إضافة أشخاص للدور</div>
        <div style="font-size:12px;color:var(--text-dim);margin-top:2px">دوّر بالاسم وضيف كذا خادم على طول — حتى اللي لسه مسجلوش</div>
      </div>
      <button class="modal-close" onclick="closeRoleAddMembersModal()">✕</button>
    </div>
    <div style="padding:16px">
      <input type="text" id="role-add-members-search" class="field-input" placeholder="🔍 دوّر على اسم خادم…" oninput="renderRoleAddMemberResults()" style="margin-bottom:10px">
      <div id="role-add-members-results" style="max-height:55vh;overflow-y:auto"></div>
      <button class="btn-primary" onclick="closeRoleAddMembersModal()" style="width:100%;margin-top:14px">تم (<span id="role-add-members-selected-count">0</span> متحدد)</button>
    </div>
  </div>
</div>
